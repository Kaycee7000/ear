[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ear-image"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx[socks]==0.28.1", "boto3==1.44.5", "pydantic==2.13.4"]
[project.optional-dependencies]
mcp = ["mcp==1.29.0"]
[project.scripts]
ear-image = "ear_image.cli:main"
ear-image-mcp = "ear_image.mcp_server:main"
[tool.setuptools]
packages = ["ear_image"]
[tool.setuptools.package-data]
ear_image = ["tool_schema.json"]
