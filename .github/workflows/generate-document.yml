name: Generate one document
run-name: ${{ github.event_name == 'workflow_dispatch' && format('ear-document-{0}', inputs.job_id) || 'Build document renderer' }}
on:
  push:
    branches: [main]
    paths:
      - "document-generation/**"
      - ".github/workflows/generate-document.yml"
  pull_request:
    paths:
      - "document-generation/**"
      - ".github/workflows/generate-document.yml"
  workflow_dispatch:
    inputs:
      job_id:
        description: Agent-created UUIDv4 for a staged private outline
        type: string
        required: true
      request_sha256:
        description: SHA-256 of the staged request bytes
        type: string
        required: true

permissions:
  contents: read

jobs:
  image:
    # Prebuild LibreOffice and the renderers once per change, test them, and (on main) publish the image.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test the renderer image
        run: |
          image=$(sh document-generation/image-tag.sh)
          docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --tag "$image" document-generation
          docker run --rm --network none --tmpfs /tmp:rw,exec,size=1g "$image" python -m unittest discover -s tests -p 'test_worker.py' -v
      - name: Publish to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$(sh document-generation/image-tag.sh)"

  render:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', vars.EAR_DOCUMENT_TRUSTED_REF || github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Load the prebuilt renderer
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=$(sh document-generation/image-tag.sh)
          start=$(date +%s)
          # Falls back to building the same Dockerfile when the image for this checkout is not published yet.
          if ! (echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin && docker pull -q "$image"); then
            docker build -q --tag "$image" document-generation
          fi
          docker logout ghcr.io
          echo "Renderer ready in $(($(date +%s) - start)) s"
          echo "$image" > "$RUNNER_TEMP/ear-document-image"
      - name: Render outline and publish to Backblaze B2
        env:
          EAR_DOCUMENT_B2_REGION: ${{ vars.EAR_DOCUMENT_B2_REGION || secrets.EAR_B2_REGION }}
          EAR_DOCUMENT_B2_BUCKET: ${{ vars.EAR_DOCUMENT_B2_BUCKET || secrets.EAR_B2_BUCKET }}
          EAR_DOCUMENT_PREFIX: ${{ vars.EAR_DOCUMENT_PREFIX || 'documents' }}
          EAR_DOCUMENT_B2_REQUEST_READ_KEY_ID: ${{ secrets.EAR_DOCUMENT_B2_REQUEST_READ_KEY_ID || secrets.EAR_B2_KEY_ID }}
          EAR_DOCUMENT_B2_REQUEST_READ_KEY: ${{ secrets.EAR_DOCUMENT_B2_REQUEST_READ_KEY || secrets.EAR_B2_APPLICATION_KEY }}
          EAR_DOCUMENT_B2_OUTPUT_WRITE_KEY_ID: ${{ secrets.EAR_DOCUMENT_B2_OUTPUT_WRITE_KEY_ID || secrets.EAR_B2_KEY_ID }}
          EAR_DOCUMENT_B2_OUTPUT_WRITE_KEY: ${{ secrets.EAR_DOCUMENT_B2_OUTPUT_WRITE_KEY || secrets.EAR_B2_APPLICATION_KEY }}
        run: |
          # Values are passed by name, so they never appear on the docker command line.
          docker run --rm --read-only --tmpfs /tmp:rw,exec,size=1g --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_EVENT_PATH,target=/run/event.json,readonly" \
            -e GITHUB_EVENT_PATH=/run/event.json -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            -e EAR_DOCUMENT_B2_REGION -e EAR_DOCUMENT_B2_BUCKET -e EAR_DOCUMENT_PREFIX \
            -e EAR_DOCUMENT_B2_REQUEST_READ_KEY_ID -e EAR_DOCUMENT_B2_REQUEST_READ_KEY \
            -e EAR_DOCUMENT_B2_OUTPUT_WRITE_KEY_ID -e EAR_DOCUMENT_B2_OUTPUT_WRITE_KEY \
            "$(cat "$RUNNER_TEMP/ear-document-image")" python worker/run.py
