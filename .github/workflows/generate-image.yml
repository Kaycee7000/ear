name: Generate one CPU image
run-name: ${{ github.event_name == 'workflow_dispatch' && format('ear-image-{0}', inputs.job_id) || 'Build image worker' }}
on:
  push:
    branches: [main]
    paths:
      - "image-generation/**"
      - ".github/workflows/generate-image.yml"
  pull_request:
    paths:
      - "image-generation/**"
      - ".github/workflows/generate-image.yml"
  workflow_dispatch:
    inputs:
      job_id:
        description: UUIDv4 created by the agent
        required: true
        type: string
      prompt:
        description: Text for one image (visible to GitHub)
        required: true
        type: string
      seed:
        description: Unsigned 32-bit decimal seed
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    # Prebuild the pinned worker environment (CPU PyTorch, diffusers) once per change; jobs pull it.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test the worker image
        run: |
          image=$(sh image-generation/image-tag.sh)
          start=$(date +%s)
          docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --tag "$image" image-generation
          echo "Built in $(($(date +%s) - start)) s: $(docker image inspect --format '{{.Size}}' "$image") bytes"
          docker run --rm --network none "$image" python -m unittest discover -s tests -p 'test_storage_worker.py' -v
          docker run --rm --network none "$image" python -c "import torch, diffusers, transformers; print(torch.__version__, diffusers.__version__)"
          # Run exactly as a job does (runner's user, no capabilities): the worker must be able to write the model
          # cache and its startup dependency check must pass without installing anything.
          mkdir -p "$RUNNER_TEMP/cache-check"
          docker run --rm --network none --cap-drop=ALL --security-opt=no-new-privileges --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$RUNNER_TEMP/cache-check,target=/app/image-generation/.model-cache" "$image" \
            sh -c 'touch .model-cache/write-check && python -m pip install --no-index -q -r worker/requirements.txt && echo "worker environment ok"'
      - name: Publish to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$(sh image-generation/image-tag.sh)"

  generate:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', vars.EAR_IMAGE_TRUSTED_REF || github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: ${{ vars.EAR_IMAGE_JOB_MINUTES && fromJSON(vars.EAR_IMAGE_JOB_MINUTES) >= 1 && fromJSON(vars.EAR_IMAGE_JOB_MINUTES) <= 30 && fromJSON(vars.EAR_IMAGE_JOB_MINUTES) || 30 }}
    defaults:
      run:
        shell: sh
        working-directory: image-generation
    env:
      EAR_IMAGE_MODEL_ID: ${{ vars.EAR_IMAGE_MODEL_ID || 'stabilityai/sd-turbo' }}
      EAR_IMAGE_MODEL_REVISION: ${{ vars.EAR_IMAGE_MODEL_REVISION || 'b261bac6fd2cf515557d5d0707481eafa0485ec2' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Restore optional model weights
        continue-on-error: true
        if: vars.EAR_IMAGE_CACHE == 'true'
        id: weights
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: image-generation/.model-cache
          key: ear-image-v1-${{ runner.arch }}-${{ env.EAR_IMAGE_MODEL_ID }}-${{ env.EAR_IMAGE_MODEL_REVISION }}
      - name: Load the prebuilt worker
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image=$(sh image-tag.sh)
          start=$(date +%s)
          # Falls back to building the same Dockerfile when the image for this checkout is not published yet.
          if ! (echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin && docker pull -q "$image"); then
            docker build -q --tag "$image" .
          fi
          docker logout ghcr.io
          mkdir -p .model-cache
          echo "$image" > "$RUNNER_TEMP/ear-image-worker"
          echo "BOOTSTRAP_SECONDS=$(($(date +%s) - start))" >> "$GITHUB_ENV"
      - name: Generate and publish to B2
        env:
          # Dedicated EAR_IMAGE_* settings win; otherwise the repository's shared EAR_B2_* secrets (the bucket
          # and key the ear pipeline already uses) are used, so no second copy of the key is needed.
          EAR_IMAGE_B2_REGION: ${{ vars.EAR_IMAGE_B2_REGION || secrets.EAR_B2_REGION }}
          EAR_IMAGE_B2_BUCKET: ${{ vars.EAR_IMAGE_B2_BUCKET || secrets.EAR_B2_BUCKET }}
          EAR_IMAGE_PREFIX: ${{ vars.EAR_IMAGE_PREFIX || 'images' }}
          EAR_IMAGE_B2_WRITE_KEY_ID: ${{ secrets.EAR_IMAGE_B2_WRITE_KEY_ID || secrets.EAR_B2_KEY_ID }}
          EAR_IMAGE_B2_WRITE_KEY: ${{ secrets.EAR_IMAGE_B2_WRITE_KEY || secrets.EAR_B2_APPLICATION_KEY }}
          EAR_IMAGE_JOB_MINUTES: ${{ vars.EAR_IMAGE_JOB_MINUTES || '30' }}
          HF_TOKEN: ${{ secrets.EAR_IMAGE_HF_TOKEN }}
        run: |
          # Accept the region as us-east-005 or as its endpoint, s3.us-east-005.backblazeb2.com.
          region=${EAR_IMAGE_B2_REGION#https://}
          region=${region#s3.}
          EAR_IMAGE_B2_REGION=${region%%.backblazeb2.com*}
          export EAR_IMAGE_B2_REGION
          # Values are passed by name, so they never appear on the docker command line.
          # As the runner's user: with all capabilities dropped, root could not write the runner-owned model cache.
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD/.model-cache,target=/app/image-generation/.model-cache" \
            --mount "type=bind,source=$GITHUB_EVENT_PATH,target=/run/event.json,readonly" \
            -e GITHUB_EVENT_PATH=/run/event.json -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e BOOTSTRAP_SECONDS \
            -e EAR_IMAGE_MODEL_ID -e EAR_IMAGE_MODEL_REVISION -e EAR_IMAGE_B2_REGION -e EAR_IMAGE_B2_BUCKET \
            -e EAR_IMAGE_PREFIX -e EAR_IMAGE_B2_WRITE_KEY_ID -e EAR_IMAGE_B2_WRITE_KEY -e EAR_IMAGE_JOB_MINUTES -e HF_TOKEN \
            "$(cat "$RUNNER_TEMP/ear-image-worker")" python worker/run.py
      - name: Check optional cache size
        id: budget
        if: success() && vars.EAR_IMAGE_CACHE == 'true' && steps.weights.outputs.cache-hit != 'true'
        run: |
          if [ "$(du -sk .model-cache | cut -f1)" -le 6291456 ]; then
            echo "fits=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save optional model weights
        continue-on-error: true
        if: steps.budget.outputs.fits == 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: image-generation/.model-cache
          key: ear-image-v1-${{ runner.arch }}-${{ env.EAR_IMAGE_MODEL_ID }}-${{ env.EAR_IMAGE_MODEL_REVISION }}
