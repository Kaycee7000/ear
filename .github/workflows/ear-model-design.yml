name: EAR model design
run-name: ear-modeling-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Private B2 request ID from the EAR agent
        type: string
        required: true

permissions:
  contents: read

jobs:
  design:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.EAR_MODELING_GPU_RUNNER || 'ear-modeling-gpu' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: modeling
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: modeling
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Generate and validate design
        env:
          EAR_REQUEST_ID: ${{ inputs.request_id }}
          EAR_B2_BUCKET: ${{ secrets.EAR_B2_BUCKET }}
          EAR_B2_REGION: ${{ secrets.EAR_B2_REGION }}
          EAR_B2_KEY_ID: ${{ secrets.EAR_B2_KEY_ID }}
          EAR_B2_APPLICATION_KEY: ${{ secrets.EAR_B2_APPLICATION_KEY }}
        run: bash gpu-worker.sh
