name: EAR extract
run-name: ear-extract-${{ inputs.request_id }}

# r2-ghidra-ci evidence extraction for the EAR pipeline. The agent writes a private request to B2 and
# dispatches this workflow with only the request ID. The job runs the prebuilt toolbox image with no network,
# then writes the extraction and a modeling evidence file back to B2. Nothing private reaches the log.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Private B2 request ID from the EAR agent tools
        type: string
        required: true

permissions:
  contents: read

jobs:
  extract:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            r2-ghidra-ci/extract
            modeling
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --disable-pip-version-check -r modeling/requirements.txt
      - run: docker pull --quiet ghcr.io/kaycee7000/ear/r2-ghidra-ci:latest
      - name: Extract evidence privately
        env:
          EAR_REQUEST_ID: ${{ inputs.request_id }}
          EAR_B2_BUCKET: ${{ secrets.EAR_B2_BUCKET }}
          EAR_B2_REGION: ${{ secrets.EAR_B2_REGION }}
          EAR_B2_KEY_ID: ${{ secrets.EAR_B2_KEY_ID }}
          EAR_B2_APPLICATION_KEY: ${{ secrets.EAR_B2_APPLICATION_KEY }}
        run: python r2-ghidra-ci/extract/b2_worker.py
