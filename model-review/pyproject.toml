[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-review"
version = "0.1.0"
description = "Review (test and validate) a local AI model on GitHub Actions, callable by an agent as an API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
test = ["pytest>=8"]

[project.scripts]
model-review = "model_review.client:main"
model-review-run = "model_review.runner:main"
model-review-mcp = "model_review.mcp_server:main"

[tool.setuptools]
packages = ["model_review"]

[tool.setuptools.package-data]
model_review = ["tool_schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
