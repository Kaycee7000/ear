# Basic sanity checks any chat model should pass. Run this first on every new model
# or checkpoint: it catches broken templates, wrong model names and empty replies.
# The mock backend answers these correctly, so `backend=mock` + `suite=smoke` should PASS.
name: smoke
description: Basic sanity checks any chat model should pass (instructions, arithmetic, JSON, multi-turn).
pass_threshold: 0.8   # 5 of 6 cases

# No latency gates here: GitHub's free CPU runners are slow and that's fine for a smoke test.
# Add `gates: {max_p95_latency_ms: ..., min_tokens_per_sec: ...}` in suites that care.

defaults:
  params:
    temperature: 0
    max_tokens: 200
    seed: 7
  strip_think: true
  timeout_s: 300

cases:
  - id: greeting
    prompt: "Say hello to me in one short sentence."
    checks:
      - contains_any: ["hello", "hi"]
        ignore_case: true
      - max_length: 300

  - id: arithmetic
    prompt: "What is 17 + 25? Reply with only the number."
    checks:
      - regex: '\b42\b'
      - max_length: 40

  - id: exact_word
    prompt: "Reply with exactly the word OK and nothing else."
    checks:
      - regex: '^\W*ok\W*$'
        ignore_case: true

  - id: json_object
    prompt: >-
      Return a JSON object for a person named Ada who is 36, with keys "name" (string)
      and "age" (integer). Output only the JSON.
    checks:
      - json_schema:
          type: object
          required: [name, age]
          properties:
            name: {type: string}
            age: {type: integer, const: 36}

  - id: multi_turn
    messages:
      - {role: user, content: "My favorite color is teal. Please remember it."}
      - {role: assistant, content: "Got it, your favorite color is teal."}
      - {role: user, content: "What is my favorite color? Answer with one word."}
    checks:
      - contains: "teal"
        ignore_case: true

  - id: factual
    prompt: "What is the capital of France? Answer with one word."
    checks:
      - contains: "Paris"
        ignore_case: true
