[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ear-document"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx[socks]==0.28.1", "boto3==1.44.5", "pydantic==2.13.4"]
[project.optional-dependencies]
mcp = ["mcp==1.29.0"]
[project.scripts]
ear-document = "ear_document.cli:main"
ear-document-mcp = "ear_document.mcp_server:main"
[tool.setuptools]
packages = ["ear_document"]
[tool.setuptools.package-data]
ear_document = ["tool_schema.json"]
