[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ear-code"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["ear-document==0.1.0"]
[project.optional-dependencies]
mcp = ["mcp==1.29.0"]
[project.scripts]
ear-code = "ear_code.cli:main"
ear-code-mcp = "ear_code.mcp_server:main"
[tool.setuptools]
packages = ["ear_code"]
[tool.setuptools.package-data]
ear_code = ["tool_schema.json"]
